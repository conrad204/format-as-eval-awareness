schema_version: 2
status: development_only
description: >-
  Second-generation purpose frames addressing proposedchanges.md items 1, 3,
  and 6. Pairs are grouped into five vocabulary folds (fg1-fg5) whose
  cue lexicons are mutually disjoint, so leave-one-fold-out probing tests
  transfer to genuinely unseen purpose vocabulary. Each fold crosses cue locus
  (noun_only / verb_only / both) with two wordings, and adds two indirect
  (context-implied) pairs and two second-person pairs kept analytically
  separate. Every class-asymmetric content token is declared in cue_tokens;
  the frames-v2 lint enforces that declared tokens are fold-disjoint and
  class-symmetric everywhere else, and a held-fold n-gram probe on the cue
  sentences must score near chance before the catalog is usable. Development
  material: the sealed confirmation bank must use fresh vocabulary disjoint
  from every token in this file (see plot-pipeline docs/analysis_plan_v2.md).
folds:
  - {fold_id: fg1, eval_theme: editorial review, deploy_theme: purchasing customer}
  - {fold_id: fg2, eval_theme: exam grading, deploy_theme: client services}
  - {fold_id: fg3, eval_theme: audit and inspection, deploy_theme: tenant maintenance}
  - {fold_id: fg4, eval_theme: scored test harness, deploy_theme: user support}
  - {fold_id: fg5, eval_theme: judged verification, deploy_theme: household shopping}
pairs:
